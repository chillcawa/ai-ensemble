name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Verify frontend and tests
        run: npm run verify
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Report development dependency advisories
        run: npm audit --audit-level=critical

  rust:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust components
        run: rustup component add rustfmt clippy
      - name: Require committed dependency lock
        run: if (-not (Test-Path "src-tauri/Cargo.lock")) { throw "src-tauri/Cargo.lock must be generated and committed before CI." }
      - name: Check formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
      - name: Run Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked
      - name: Lint Rust
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --locked --all-targets -- -D warnings
